<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #day-sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #f6c9a8 0%, #f3e3d3 100%);
    }
    #day-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
  </style>
  <div id="root" data-composition-id="world" data-width="1080" data-height="1920" data-layout-allow-overflow>
    <div id="day-sky"></div>
    <canvas id="day-canvas" class="clip" data-start="0" data-duration="26.6" data-track-index="0" width="1080" height="1920"></canvas>
  </div>
  <script>
    (function () {
      var DURATION = 26.6;
      var clock = { t: 0 };
      var host = { clock: clock, render: null };
      window.__rexDay = host;
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["world"] = new Promise(function (resolve) {
        host.ready = resolve;
      });
      var tl = gsap.timeline({ paused: true });
      tl.to(clock, {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          if (host.render) host.render(clock.t);
        },
      }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["world"] = tl;
    })();
  </script>
  <script type="module">
    import * as THREE from "./assets/lib/three.module.min.js";
    import { RoundedBoxGeometry } from "./assets/lib/RoundedBoxGeometry.js";
    import { RoomEnvironment } from "./assets/lib/RoomEnvironment.js";

    const host = window.__rexDay;
    const W = 1080, H = 1920;
    const sky = document.getElementById("day-sky");

    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const seg = (t, a, b) => clamp((t - a) / (b - a));
    const lerp = (a, b, k) => a + (b - a) * k;
    const inOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
    const outCubic = (k) => 1 - Math.pow(1 - k, 3);
    const outQuint = (k) => 1 - Math.pow(1 - k, 5);

    // The hour of the day at film time t: fast between beats, slow while a beat is told.
    const HOURS = [[0, 6.9], [2.4, 7.4], [3.0, 9.0], [6.4, 10.2], [7.0, 12.8], [9.6, 13.4], [10.2, 15.2], [13.8, 16.0], [14.4, 18.3], [17.2, 19.0], [17.8, 21.8], [21.0, 22.4], [26.6, 23.4]];
    function hourAt(t) {
      let i = 0;
      while (i < HOURS.length - 2 && t > HOURS[i + 1][0]) i++;
      const [t0, h0] = HOURS[i], [t1, h1] = HOURS[i + 1];
      return lerp(h0, h1, inOut(seg(t, t0, t1)));
    }

    // Sky palette by hour: [hour, top, bottom].
    const SKY = [
      [6.0, "#2a3446", "#5a5466"],
      [7.0, "#f2b48c", "#f6dcc4"],
      [9.0, "#cfe3ee", "#f2efe6"],
      [13.0, "#bcdcee", "#eef4f3"],
      [16.0, "#cfe1e6", "#f3eee2"],
      [18.6, "#f0a36c", "#f7d6b6"],
      [19.6, "#7a6487", "#e7a98a"],
      [20.8, "#122a38", "#2c4a55"],
      [24.0, "#0b1e2a", "#1a3540"],
    ];
    const cA = new THREE.Color(), cB = new THREE.Color();
    function skyAt(h) {
      let i = 0;
      while (i < SKY.length - 2 && h > SKY[i + 1][0]) i++;
      const k = seg(h, SKY[i][0], SKY[i + 1][0]);
      const top = cA.set(SKY[i][1]).lerp(new THREE.Color(SKY[i + 1][1]), k).getHexString();
      const bot = cB.set(SKY[i][2]).lerp(new THREE.Color(SKY[i + 1][2]), k).getHexString();
      return [top, bot];
    }

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("day-canvas"), antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    const camera = new THREE.PerspectiveCamera(20, W / H, 1, 300);

    const hemi = new THREE.HemisphereLight(0xffffff, 0xd8d4cc, 0.3);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 2.6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 80 });
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.02;
    sun.shadow.radius = 4;
    scene.add(sun, sun.target);

    const std = (c, r = 0.85, m = 0, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m, ...extra });
    const clay = std(0xeeece7, 0.92);
    const plinthSide = std(0x173a33, 0.75);
    const lawn = std(0xbfd0b8, 0.95);
    const render = std(0xf3f1ec, 0.75);
    const anthracite = std(0x2b3134, 0.55, 0.2);
    const mint = new THREE.MeshBasicMaterial({ color: 0x79ffbb });
    const rbox = (w, h, d, m, r = 0.04) => new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2.2, h / 2.2, d / 2.2)), m);
    const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);

    function canvasTex(draw, w = 256, h = 256) {
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      draw(c.getContext("2d"));
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 4;
      return t;
    }
    const woodTex = canvasTex((g) => {
      for (let x = 0; x < 256; x += 16) {
        const v = 0.85 + (0.15 * ((x * 37) % 7)) / 7;
        g.fillStyle = `rgb(${Math.round(150 * v)},${Math.round(104 * v)},${Math.round(70 * v)})`;
        g.fillRect(x, 0, 13, 256);
        g.fillStyle = "#4a3022";
        g.fillRect(x + 13, 0, 3, 256);
      }
    });
    woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
    woodTex.repeat.set(2.2, 1);
    const wood = std(0xffffff, 0.68, 0, { map: woodTex });
    const cellMat = new THREE.MeshStandardMaterial({
      map: canvasTex((g) => {
        g.fillStyle = "#0f2244";
        g.fillRect(0, 0, 256, 256);
        g.strokeStyle = "#5d7fb8";
        g.lineWidth = 2;
        for (let i = 0; i <= 6; i++) { g.beginPath(); g.moveTo((i * 256) / 6, 0); g.lineTo((i * 256) / 6, 256); g.stroke(); }
        for (let j = 0; j <= 10; j++) { g.beginPath(); g.moveTo(0, j * 25.6); g.lineTo(256, j * 25.6); g.stroke(); }
      }),
      roughness: 0.18, metalness: 0.35, emissive: 0x3d7cff, emissiveIntensity: 0,
    });
    const aluMat = std(0xc9ccce, 0.35, 0.8);

    // ---------- the diorama ----------
    const plinth = new THREE.Mesh(new RoundedBoxGeometry(13, 1.4, 13, 3, 0.25), [plinthSide, plinthSide, clay, plinthSide, plinthSide, plinthSide]);
    plinth.position.y = -0.7;
    scene.add(plinth);
    const grass = box(12.6, 0.06, 12.6, lawn);
    grass.position.y = 0.03;
    scene.add(grass);
    const terrace = box(6.2, 0.08, 1.6, std(0xd9d6cf, 0.8));
    terrace.position.set(-0.3, 0.06, 2.6);
    scene.add(terrace);
    const drive = box(2.2, 0.08, 6.8, std(0xd2d0ca, 0.85));
    drive.position.set(3.6, 0.06, 2.9);
    scene.add(drive);

    const HW = 4.4, HD = 3.4, HH = 2.6, UW = 3.4, UD = 3.8, UH = 2.3;
    const HERO = new THREE.Vector3(-0.6, 0, -0.6);
    const hero = new THREE.Group();
    const lower = rbox(HW, HH, HD, render, 0.05);
    lower.position.y = HH / 2;
    const upper = box(UW, UH, UD, wood);
    upper.position.set(-0.45, HH + UH / 2, 0.2);
    const roofSlab = box(UW + 0.3, 0.16, UD + 0.3, anthracite);
    roofSlab.position.set(upper.position.x, HH + UH + 0.08, upper.position.z);
    hero.add(lower, upper, roofSlab);
    const heroGlass = new THREE.MeshStandardMaterial({ color: 0x1d2a30, roughness: 0.06, metalness: 0.2, emissive: 0xffc98a, emissiveIntensity: 0 });
    function makeWindow(w, h) {
      const g = new THREE.Group();
      g.add(box(w + 0.08, h + 0.08, 0.06, anthracite));
      const glass = box(w, h, 0.07, heroGlass);
      glass.position.z = 0.01;
      g.add(glass);
      return g;
    }
    const bay = makeWindow(2.4, 1.95);
    bay.position.set(0.55, 1.05, HD / 2 + 0.02);
    const strip = makeWindow(2.3, 0.85);
    strip.position.set(upper.position.x, HH + 1.3, upper.position.z + UD / 2 + 0.02);
    const sideWin = makeWindow(1.2, 1.5);
    sideWin.rotation.y = Math.PI / 2;
    sideWin.position.set(HW / 2 + 0.02, 1.25, -0.5);
    const door = box(0.95, 2.05, 0.06, anthracite);
    door.position.set(-1.45, 1.03, HD / 2 + 0.03);
    hero.add(bay, strip, sideWin, door);
    hero.position.copy(HERO);
    scene.add(hero);

    // Solar array on the roof.
    const roofY = HH + UH + 0.16;
    const panelsRoot = new THREE.Group();
    panelsRoot.position.set(HERO.x + upper.position.x, roofY, HERO.z + upper.position.z);
    scene.add(panelsRoot);
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 3; c++) {
        const g = new THREE.Group();
        const tilt = new THREE.Group();
        const frame = rbox(0.98, 0.05, 1.45, aluMat, 0.02);
        const cell = box(0.92, 0.02, 1.39, cellMat);
        cell.position.y = 0.03;
        tilt.add(frame, cell);
        tilt.rotation.x = 0.32;
        tilt.position.y = 0.32;
        const leg = box(0.05, 0.42, 0.05, aluMat);
        leg.position.set(0, 0.2, -0.55);
        g.add(tilt, leg);
        g.position.set((c - 1) * 1.04, 0, (r - 0.5) * 1.65);
        panelsRoot.add(g);
      }
    }

    // Wall battery with a mint charge bar.
    const battery = new THREE.Group();
    const batBody = rbox(0.62, 1.15, 0.2, std(0x2b3134, 0.35, 0.3), 0.06);
    batBody.position.y = 0.58;
    const gaugeBack = box(0.09, 0.92, 0.015, std(0x0e1416, 0.6));
    gaugeBack.position.set(-0.2, 0.58, 0.1);
    const gauge = box(0.07, 0.9, 0.02, mint);
    gauge.geometry.translate(0, 0.45, 0);
    gauge.position.set(-0.2, 0.13, 0.105);
    battery.add(batBody, gaugeBack, gauge);
    battery.position.set(HERO.x - 0.4, 0.25, HERO.z + HD / 2 + 0.11);
    scene.add(battery);

    // Charger by the drive.
    const charger = new THREE.Group();
    const post = rbox(0.24, 1.15, 0.18, std(0x012b26, 0.4, 0.2), 0.05);
    post.position.y = 0.58;
    const face = box(0.02, 0.36, 0.1, mint);
    face.position.set(0.125, 0.85, 0);
    charger.add(post, face);
    charger.position.set(2.15, 0, 0.6);
    scene.add(charger);

    // Car.
    const CAR_PARK = new THREE.Vector3(3.6, 0, 1.0);
    const car = new THREE.Group();
    const paint = new THREE.MeshPhysicalMaterial({ color: 0xf2f2f0, roughness: 0.28, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.08 });
    const body = rbox(0.98, 0.45, 2.05, paint, 0.16);
    body.position.y = 0.42;
    const cabin = rbox(0.86, 0.42, 1.15, std(0x161b1e, 0.08, 0.3), 0.18);
    cabin.position.set(0, 0.8, -0.1);
    car.add(body, cabin);
    for (const [x, z] of [[0.47, 0.65], [-0.47, 0.65], [0.47, -0.65], [-0.47, -0.65]]) {
      const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.16, 20), std(0x1b1d1e, 0.7));
      wh.rotation.z = Math.PI / 2;
      wh.position.set(x, 0.21, z);
      car.add(wh);
    }
    const carBar = new THREE.MeshBasicMaterial({ color: 0x79ffbb, transparent: true, opacity: 0.25 });
    const lightBar = box(0.8, 0.04, 0.02, carBar);
    lightBar.position.set(0, 0.52, -1.03);
    car.add(lightBar);
    car.rotation.y = Math.PI; // nose to the house
    scene.add(car);
    const plugCable = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
        new THREE.Vector3(2.28, 0.85, 0.6),
        new THREE.Vector3(2.6, 0.12, 0.85),
        new THREE.Vector3(CAR_PARK.x - 0.5, 0.55, CAR_PARK.z - 0.4),
      ]), 30, 0.03, 6, false),
      std(0x012b26, 0.5),
    );
    plugCable.visible = false;
    scene.add(plugCable);

    // Heat pump / AC on the side wall.
    const ac = new THREE.Group();
    const acBody = rbox(0.36, 0.7, 1.0, std(0xe8eaeb, 0.4, 0.1), 0.04);
    const grille = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.03, 32), anthracite);
    grille.rotation.z = Math.PI / 2;
    grille.position.set(0.19, 0, 0.15);
    const fan = new THREE.Group();
    for (let i = 0; i < 4; i++) {
      const bl = box(0.02, 0.4, 0.09, std(0xbfc5c7, 0.4, 0.4));
      bl.rotation.x = (i * Math.PI) / 2;
      fan.add(bl);
    }
    fan.position.set(0.21, 0, 0.15);
    ac.add(acBody, grille, fan);
    ac.position.set(HERO.x + HW / 2 + 0.19, 0.55, HERO.z - 0.9);
    scene.add(ac);

    // Garden: two sculpted trees, a hedge, a bench.
    const crown = std(0xb9c9b1, 0.9), trunk = std(0x8d8a82, 0.8);
    for (const [x, z, s] of [[-4.6, 3.8, 1.15], [-4.9, -4.4, 1.0], [4.9, -4.6, 0.9]]) {
      const g = new THREE.Group();
      const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.07 * s, 0.09 * s, 1.5 * s, 8), trunk);
      tr.position.y = 0.75 * s;
      const cr = new THREE.Mesh(new THREE.SphereGeometry(0.7 * s, 24, 16), crown);
      cr.scale.y = 1.25;
      cr.position.y = 1.9 * s;
      g.add(tr, cr);
      g.position.set(x, 0, z);
      scene.add(g);
    }
    const hedge = rbox(0.6, 0.7, 5.0, std(0xa9bca1, 0.95), 0.25);
    hedge.position.set(-5.9, 0.38, 0.4);
    scene.add(hedge);

    // Energy dashes on three routes.
    const v = (x, y, z) => new THREE.Vector3(x, y, z);
    const roofEdgeZ = HERO.z + upper.position.z + UD / 2;
    const routes = {
      house: new THREE.CatmullRomCurve3([v(HERO.x - 0.4, roofY - 0.1, roofEdgeZ + 0.1), v(HERO.x + 1.6, HH + 0.3, HERO.z + HD / 2 + 0.25), v(HERO.x + 0.6, 1.0, HERO.z + HD / 2 + 0.25)]),
      battery: new THREE.CatmullRomCurve3([v(HERO.x - 0.4, roofY - 0.1, roofEdgeZ + 0.1), v(HERO.x - 0.4, HH + 0.1, HERO.z + HD / 2 + 0.25), v(HERO.x - 0.6, 1.4, HERO.z + HD / 2 + 0.25)]),
      ac: new THREE.CatmullRomCurve3([v(HERO.x + 0.6, roofY - 0.1, HERO.z), v(HERO.x + HW / 2 + 0.3, HH, HERO.z - 0.4), v(HERO.x + HW / 2 + 0.4, 1.0, HERO.z - 0.9)]),
      car: new THREE.CatmullRomCurve3([v(HERO.x - 0.2, 0.3, HERO.z + HD / 2 + 0.4), v(1.0, 0.08, 1.6), v(2.15, 0.08, 0.95), v(CAR_PARK.x - 0.5, 0.5, CAR_PARK.z - 0.4)]),
      night: new THREE.CatmullRomCurve3([v(HERO.x - 0.6, 1.0, HERO.z + HD / 2 + 0.3), v(HERO.x + 0.2, 0.1, HERO.z + HD / 2 + 0.5), v(HERO.x + 0.6, 1.0, HERO.z + HD / 2 + 0.25)]),
    };
    const dashGroups = {};
    for (const k of Object.keys(routes)) {
      dashGroups[k] = [];
      for (let i = 0; i < 14; i++) {
        const m = box(0.2, 0.07, 0.2, mint);
        m.visible = false;
        scene.add(m);
        dashGroups[k].push(m);
      }
    }
    function flow(name, t, a, b, speed = 0.45) {
      const on = t >= a && t < b;
      const env = Math.min(seg(t, a, a + 0.4), 1 - seg(t, b - 0.4, b));
      dashGroups[name].forEach((m, i) => {
        m.visible = on && env > 0.01;
        if (!m.visible) return;
        const s = (((t - a) * speed + i / 14) % 1 + 1) % 1;
        m.position.copy(routes[name].getPointAt(s));
        m.scale.setScalar(Math.max(0.001, env));
      });
    }

    scene.traverse((o) => {
      if (o.isMesh && o.material !== mint && o.material !== carBar) {
        o.castShadow = true;
        o.receiveShadow = true;
      }
    });

    // ---------- camera: one slow orbit around the diorama all day ----------
    const EL = THREE.MathUtils.degToRad(30);
    const halfH = THREE.MathUtils.degToRad(camera.fov / 2);
    function placeCamera(t) {
      const k = inOut(seg(t, 0, 26.6));
      const az = THREE.MathUtils.degToRad(lerp(24, 62, k));
      const w = lerp(12.6, 10.6, outCubic(seg(t, 0, 10))) + lerp(0, 1.4, seg(t, 20, 26.6));
      const target = new THREE.Vector3(0.3, 1.9, 0.4);
      const hw = Math.atan(Math.tan(halfH) * (W / H));
      const dist = w / 2 / Math.tan(hw);
      const dir = new THREE.Vector3(Math.sin(az) * Math.cos(EL), Math.sin(EL), Math.cos(az) * Math.cos(EL));
      camera.position.copy(target).addScaledVector(dir, dist);
      camera.lookAt(target);
      camera.setViewOffset(W, H, 0, -H * 0.15, W, H);
      camera.updateProjectionMatrix();
    }

    const warmLow = new THREE.Color(0xffb27a), noonC = new THREE.Color(0xfff6ea), moonC = new THREE.Color(0x9fb6ff);
    host.render = (t) => {
      const h = hourAt(t);
      const [top, bot] = skyAt(h);
      sky.style.background = `linear-gradient(180deg, #${top} 0%, #${bot} 100%)`;

      // Sun arc: rises left-back, sets right-back. After sunset a cool moonlight.
      const f = (h - 6.5) / (20.3 - 6.5);
      const day = clamp(Math.sin(Math.PI * clamp(f)), 0, 1);
      const night = seg(h, 19.8, 21.2);
      if (f <= 1) {
        sun.position.set(-Math.cos(Math.PI * f) * 18, 3 + 20 * day, -10 + 4 * day);
        sun.color.copy(warmLow).lerp(noonC, Math.pow(day, 0.7));
        sun.intensity = lerp(0.6, 3.0, Math.pow(day, 0.8)) * (1 - night);
      }
      if (night > 0) {
        const mk = night;
        sun.position.lerp(new THREE.Vector3(-8, 18, 8), mk);
        sun.color.lerp(moonC, mk);
        sun.intensity = lerp(sun.intensity, 0.55, mk);
      }
      hemi.intensity = lerp(0.3, 0.12, night);
      scene.environmentIntensity = lerp(0.55, 0.12, night) * lerp(0.6, 1, day + night);
      renderer.toneMappingExposure = lerp(1.05, 0.95, night);

      // Panels shimmer while they produce.
      cellMat.emissiveIntensity = 0.18 * day * (1 - night);

      // Morning: panels → house. Noon: → battery. Afternoon: → AC. Evening: → car. Night: battery → house.
      flow("house", t, 2.9, 6.6);
      flow("battery", t, 7.0, 9.9);
      flow("ac", t, 10.2, 14.0);
      flow("car", t, 15.6, 17.6);
      flow("night", t, 18.4, 26.6, 0.3);

      gauge.scale.y = Math.max(0.001, lerp(0.25, 1.0, inOut(seg(t, 7.1, 9.6))) - lerp(0, 0.35, seg(t, 18.4, 26.6)) - lerp(0, 0.15, seg(t, 15.6, 17.4)));
      // The fan idles, then runs hard through the hot afternoon.
      fan.rotation.x = t * 2 + 10 * clamp(t - 10.2, 0, 4.2);

      // The car comes home at 18:30 and plugs in.
      const ca = seg(t, 14.4, 15.4);
      car.visible = t >= 14.4;
      car.position.set(CAR_PARK.x, 0, lerp(7.4, CAR_PARK.z, outQuint(ca)));
      plugCable.visible = t >= 15.5;
      carBar.opacity = t < 15.6 ? 0.25 : lerp(0.25, 1, inOut(seg(t, 15.6, 17.4)));

      heroGlass.emissiveIntensity = lerp(0, 1.0, seg(h, 19.2, 20.6));

      placeCamera(t);
      renderer.render(scene, camera);
    };
    host.render(host.clock.t);
    host.ready();
  </script>
</template>
