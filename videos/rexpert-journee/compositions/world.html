<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #cfe3ee;
    }
    #day-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
  </style>
  <div id="root" data-composition-id="world" data-width="1080" data-height="1920" data-layout-allow-overflow>
    <canvas id="day-canvas" class="clip" data-start="0" data-duration="26.6" data-track-index="0" width="1080" height="1920"></canvas>
  </div>
  <script>
    (function () {
      var DURATION = 26.6;
      var clock = { t: 0 };
      var host = { clock: clock, render: null };
      window.__rexDay = host;
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["world"] = new Promise(function (resolve) {
        host.ready = resolve;
      });
      var tl = gsap.timeline({ paused: true });
      tl.to(clock, {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          if (host.render) host.render(clock.t);
        },
      }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["world"] = tl;
    })();
  </script>
  <script type="module">
    import * as THREE from "./assets/lib/three.module.min.js";
    import { RoundedBoxGeometry } from "./assets/lib/RoundedBoxGeometry.js";
    import { RoomEnvironment } from "./assets/lib/RoomEnvironment.js";
    import { EffectComposer } from "./assets/lib/jsm/postprocessing/EffectComposer.js";
    import { RenderPass } from "./assets/lib/jsm/postprocessing/RenderPass.js";
    import { GTAOPass } from "./assets/lib/jsm/postprocessing/GTAOPass.js";
    import { OutputPass } from "./assets/lib/jsm/postprocessing/OutputPass.js";

    const host = window.__rexDay;
    const W = 1080, H = 1920;

    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const seg = (t, a, b) => clamp((t - a) / (b - a));
    const lerp = (a, b, k) => a + (b - a) * k;
    const inOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
    const outCubic = (k) => 1 - Math.pow(1 - k, 3);
    const outQuint = (k) => 1 - Math.pow(1 - k, 5);
    const mulberry = (a) => () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

    // ---------- the hour of the day (shared with the clock in titles.html) ----------
    const HOURS = [[0, 6.9], [2.4, 7.4], [3.0, 9.0], [6.4, 10.2], [7.0, 12.8], [9.6, 13.4], [10.2, 15.2], [13.8, 16.0], [14.4, 18.3], [17.2, 19.0], [17.8, 21.8], [21.0, 22.4], [26.6, 23.4]];
    function hourAt(t) {
      let i = 0;
      while (i < HOURS.length - 2 && t > HOURS[i + 1][0]) i++;
      const [t0, h0] = HOURS[i], [t1, h1] = HOURS[i + 1];
      return lerp(h0, h1, inOut(seg(t, t0, t1)));
    }
    // [hour, zenith, horizon]
    const SKY = [
      [6.0, "#2c3a52", "#8c7a86"],
      [7.0, "#7f9fc9", "#f4b98e"],
      [9.0, "#4f8fd0", "#b8d5ec"],
      [13.0, "#3f84d0", "#aacdeb"],
      [16.0, "#5a92cc", "#c4d9e6"],
      [18.6, "#5f7fa8", "#f3a96e"],
      [19.6, "#33405f", "#c9876e"],
      [20.8, "#0d1b2c", "#24384a"],
      [24.0, "#070f1c", "#152636"],
    ];
    function skyAt(h, outTop, outHor) {
      let i = 0;
      while (i < SKY.length - 2 && h > SKY[i + 1][0]) i++;
      const k = seg(h, SKY[i][0], SKY[i + 1][0]);
      outTop.set(SKY[i][1]).lerp(new THREE.Color(SKY[i + 1][1]), k);
      outHor.set(SKY[i][2]).lerp(new THREE.Color(SKY[i + 1][2]), k);
    }

    // ---------- renderer + post (ambient occlusion) ----------
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("day-canvas"), antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.fog = new THREE.Fog(0xdfe9ef, 40, 140);
    const camera = new THREE.PerspectiveCamera(32, W / H, 0.5, 400);

    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(1);
    composer.setSize(W, H);
    composer.addPass(new RenderPass(scene, camera));
    const gtao = new GTAOPass(scene, camera, W, H);
    gtao.output = GTAOPass.OUTPUT.Default;
    gtao.blendIntensity = 0.85;
    gtao.updateGtaoMaterial({ radius: 0.55, distanceExponent: 1.2, thickness: 1.2, scale: 1.0, samples: 12 });
    gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 12 });
    composer.addPass(gtao);
    composer.addPass(new OutputPass());

    const hemi = new THREE.HemisphereLight(0xdfeaff, 0x5f6b4a, 0.45);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 3);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 90 });
    sun.shadow.bias = -0.00025;
    sun.shadow.normalBias = 0.025;
    sun.shadow.radius = 3;
    scene.add(sun, sun.target);

    // ---------- sky dome with a sun disc ----------
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
      uniforms: {
        zenith: { value: new THREE.Color("#6f9fcf") },
        horizon: { value: new THREE.Color("#dfe9ef") },
        sunDir: { value: new THREE.Vector3(0, 1, 0) },
        sunColor: { value: new THREE.Color(1, 1, 1) },
        sunAmount: { value: 1 },
      },
      vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `uniform vec3 zenith; uniform vec3 horizon; uniform vec3 sunDir; uniform vec3 sunColor; uniform float sunAmount; varying vec3 vDir;
        void main(){
          float y = clamp(vDir.y, 0.0, 1.0);
          vec3 col = mix(horizon, zenith, pow(y, 0.35));
          float d = max(dot(normalize(vDir), normalize(sunDir)), 0.0);
          col += sunColor * (pow(d, 900.0) * 4.0 + pow(d, 60.0) * 0.35 + pow(d, 8.0) * 0.12) * sunAmount;
          gl_FragColor = vec4(col, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`,
    });
    const skyDome = new THREE.Mesh(new THREE.SphereGeometry(180, 48, 24), skyMat);
    scene.add(skyDome);

    // ---------- procedural textures ----------
    function canvasTex(w, h, draw, repeat = [1, 1], srgb = true) {
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      draw(c.getContext("2d"), w, h);
      const t = new THREE.CanvasTexture(c);
      if (srgb) t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(repeat[0], repeat[1]);
      t.anisotropy = 8;
      return t;
    }
    function speckle(g, w, h, n, colors, size, seed) {
      const r = mulberry(seed);
      for (let i = 0; i < n; i++) {
        g.fillStyle = colors[Math.floor(r() * colors.length)];
        const s = size * (0.5 + r());
        g.fillRect(r() * w, r() * h, s, s * (0.6 + r()));
      }
    }
    const grassTex = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = "#5f8a3d"; g.fillRect(0, 0, w, h);
      speckle(g, w, h, 26000, ["#4d7a31", "#6c9a46", "#7fa952", "#567f36", "#8db35c", "#486f2c"], 3, 3);
    }, [60, 60]);
    const grassMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.95, bumpMap: grassTex, bumpScale: 0.6 });

    const renderTex = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = "#eeebe4"; g.fillRect(0, 0, w, h);
      speckle(g, w, h, 9000, ["#e6e2da", "#f4f2ed", "#e0dcd3", "#ebe7df"], 2, 9);
    }, [3, 2]);
    const renderMat = new THREE.MeshStandardMaterial({ map: renderTex, roughness: 0.92, bumpMap: renderTex, bumpScale: 0.3 });

    const woodTex = canvasTex(512, 512, (g, w, h) => {
      const r = mulberry(21);
      for (let x = 0; x < w; x += 24) {
        const v = 0.8 + 0.25 * r();
        g.fillStyle = `rgb(${Math.round(146 * v)},${Math.round(98 * v)},${Math.round(62 * v)})`;
        g.fillRect(x, 0, 21, h);
        for (let k = 0; k < 14; k++) {
          g.strokeStyle = `rgba(70,42,24,${0.12 + 0.2 * r()})`;
          g.lineWidth = 1;
          g.beginPath();
          const gx = x + 2 + r() * 17;
          g.moveTo(gx, 0);
          g.bezierCurveTo(gx + 2, h * 0.3, gx - 2, h * 0.6, gx + 1, h);
          g.stroke();
        }
        g.fillStyle = "#3a2416";
        g.fillRect(x + 21, 0, 3, h);
      }
    }, [2.4, 1]);
    const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.7, bumpMap: woodTex, bumpScale: 0.8 });

    const deckTex = canvasTex(512, 512, (g, w, h) => {
      const r = mulberry(5);
      for (let y = 0; y < h; y += 32) {
        const v = 0.8 + 0.2 * r();
        g.fillStyle = `rgb(${Math.round(120 * v)},${Math.round(92 * v)},${Math.round(70 * v)})`;
        g.fillRect(0, y, w, 29);
        g.fillStyle = "#2f241c"; g.fillRect(0, y + 29, w, 3);
      }
    }, [2, 1]);
    const deckMat = new THREE.MeshStandardMaterial({ map: deckTex, roughness: 0.8, bumpMap: deckTex, bumpScale: 0.5 });

    const paverTex = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = "#6f6d69"; g.fillRect(0, 0, w, h);
      const r = mulberry(8);
      for (let y = 0; y < h; y += 32) for (let x = (y / 32) % 2 ? -32 : 0; x < w; x += 64) {
        const v = 0.82 + 0.2 * r();
        g.fillStyle = `rgb(${Math.round(176 * v)},${Math.round(172 * v)},${Math.round(164 * v)})`;
        g.fillRect(x + 2, y + 2, 60, 28);
      }
    }, [1.5, 3]);
    const paverMat = new THREE.MeshStandardMaterial({ map: paverTex, roughness: 0.9, bumpMap: paverTex, bumpScale: 0.5 });

    const brickTex = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = "#cfc7bb"; g.fillRect(0, 0, w, h);
      const r = mulberry(13);
      for (let y = 0; y < h; y += 16) for (let x = (y / 16) % 2 ? -24 : 0; x < w; x += 48) {
        const v = 0.78 + 0.25 * r();
        g.fillStyle = `rgb(${Math.round(150 * v)},${Math.round(72 * v)},${Math.round(52 * v)})`;
        g.fillRect(x + 1, y + 1, 46, 14);
      }
    }, [2, 2]);
    const brickMat = new THREE.MeshStandardMaterial({ map: brickTex, roughness: 0.9, bumpMap: brickTex, bumpScale: 0.6 });

    const tileTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#2c2d2f"; g.fillRect(0, 0, w, h);
      const r = mulberry(17);
      for (let y = 0; y < h; y += 16) for (let x = (y / 16) % 2 ? -12 : 0; x < w; x += 24) {
        const v = 0.8 + 0.3 * r();
        g.fillStyle = `rgb(${Math.round(58 * v)},${Math.round(60 * v)},${Math.round(64 * v)})`;
        g.fillRect(x + 1, y + 1, 22, 14);
      }
    }, [3, 2]);
    const tileMat = new THREE.MeshStandardMaterial({ map: tileTex, roughness: 0.7, bumpMap: tileTex, bumpScale: 0.6 });

    const gravelTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#77756f"; g.fillRect(0, 0, w, h);
      speckle(g, w, h, 6000, ["#8e8b84", "#5f5d58", "#a3a097", "#6c6a64"], 2.5, 31);
    }, [3, 3]);
    const gravelMat = new THREE.MeshStandardMaterial({ map: gravelTex, roughness: 0.95, bumpMap: gravelTex, bumpScale: 0.6 });

    const leafTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#3f6b2a"; g.fillRect(0, 0, w, h);
      speckle(g, w, h, 5000, ["#335c22", "#4f7d33", "#5f8f3c", "#2d4f1d", "#6f9a45"], 5, 41);
    }, [2, 2]);
    const leafMat = new THREE.MeshStandardMaterial({ map: leafTex, roughness: 0.85, bumpMap: leafTex, bumpScale: 1.2 });
    const hedgeMat = new THREE.MeshStandardMaterial({ map: leafTex, roughness: 0.9, bumpMap: leafTex, bumpScale: 1.4, color: 0xb8c9a8 });

    const cellTex = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = "#0c111a"; g.fillRect(0, 0, w, h);
      g.strokeStyle = "#2b3444"; g.lineWidth = 3;
      for (let i = 0; i <= 6; i++) { g.beginPath(); g.moveTo((i * w) / 6, 0); g.lineTo((i * w) / 6, h); g.stroke(); }
      for (let j = 0; j <= 10; j++) { g.beginPath(); g.moveTo(0, (j * h) / 10); g.lineTo(w, (j * h) / 10); g.stroke(); }
      g.strokeStyle = "rgba(160,175,200,0.18)"; g.lineWidth = 1;
      for (let i = 0; i < 60; i++) { g.beginPath(); g.moveTo(((i % 6) + 0.5) * w / 6, 0); g.lineTo(((i % 6) + 0.5) * w / 6, h); g.stroke(); }
    });
    const cellMat = new THREE.MeshPhysicalMaterial({ map: cellTex, roughness: 0.12, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0.05, emissive: 0x2a5bd0, emissiveIntensity: 0 });

    // Interior seen through the glass: a warm room with a sofa and a lamp.
    const roomTex = canvasTex(512, 384, (g, w, h) => {
      g.fillStyle = "#c9b9a3"; g.fillRect(0, 0, w, h);
      g.fillStyle = "#a89780"; g.fillRect(0, h * 0.72, w, h * 0.28);
      g.fillStyle = "#5c6a6d"; g.fillRect(w * 0.12, h * 0.5, w * 0.5, h * 0.24);
      g.fillStyle = "#4b585b"; g.fillRect(w * 0.12, h * 0.42, w * 0.5, h * 0.12);
      g.fillStyle = "#2e2a26"; g.fillRect(w * 0.76, h * 0.25, w * 0.012, h * 0.5);
      g.fillStyle = "#f3dfb8"; g.beginPath(); g.ellipse(w * 0.765, h * 0.24, w * 0.05, h * 0.05, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#8a6b4f"; g.fillRect(w * 0.68, h * 0.1, w * 0.18, h * 0.08);
    }, [1, 1]);
    const roomMat = new THREE.MeshStandardMaterial({ map: roomTex, roughness: 0.9, emissive: 0xffc58a, emissiveMap: roomTex, emissiveIntensity: 0 });

    const std = (c, r = 0.85, m = 0, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m, ...extra });
    const anthracite = std(0x2a2e31, 0.5, 0.35);
    const alu = std(0xc8cbcd, 0.3, 0.85);
    const mint = new THREE.MeshBasicMaterial({ color: 0x79ffbb });
    const glass = new THREE.MeshPhysicalMaterial({ color: 0x9fb4bd, roughness: 0.02, metalness: 0, transparent: true, opacity: 0.28, envMapIntensity: 1.6 });
    const rbox = (w, h, d, m, r = 0.04) => new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2.2, h / 2.2, d / 2.2)), m);
    const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    const uv = (mesh, sx, sy) => { const t = mesh.material.map; return mesh; };

    // ---------- ground, garden, neighbours ----------
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), grassMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
    const road = box(260, 0.04, 6.0, std(0x3d3f41, 0.92));
    road.position.set(0, 0.02, 11.5);
    scene.add(road);
    const kerb = box(260, 0.14, 0.25, std(0xb9b6ae, 0.85));
    kerb.position.set(0, 0.07, 8.4);
    scene.add(kerb);
    const pavement = box(260, 0.06, 1.6, paverMat);
    pavement.position.set(0, 0.03, 7.5);
    scene.add(pavement);

    const HW = 4.6, HD = 3.6, HH = 2.7, UW = 3.6, UD = 4.0, UH = 2.4;
    const HERO = new THREE.Vector3(-0.6, 0, -0.4);

    const terrace = box(5.6, 0.12, 2.2, deckMat);
    terrace.position.set(-0.9, 0.06, HERO.z + HD / 2 + 1.1);
    scene.add(terrace);
    const drive = box(2.6, 0.06, 7.2, paverMat);
    drive.position.set(3.7, 0.03, 3.3);
    scene.add(drive);
    // stepping stones to the door
    for (let i = 0; i < 4; i++) {
      const s = box(0.7, 0.05, 0.45, std(0xa9a59c, 0.9));
      s.position.set(-2.2 + (i % 2) * 0.15, 0.03, 3.0 + i * 0.95);
      scene.add(s);
    }
    // hedge along the plot
    for (const [x, z, w, d] of [[-6.2, 1.2, 0.8, 11], [0.2, -6.6, 13.6, 0.8], [6.2, -2.6, 0.8, 7.6]]) {
      const hdg = rbox(w, 1.1, d, hedgeMat, 0.35);
      hdg.position.set(x, 0.55, z);
      scene.add(hdg);
    }
    // a wooden fence by the road
    for (let x = -6; x <= 2.2; x += 0.5) {
      const post = box(0.08, 0.9, 0.08, std(0x6a4d35, 0.8));
      post.position.set(x, 0.45, 6.6);
      scene.add(post);
    }
    const rail = box(8.3, 0.08, 0.06, std(0x6a4d35, 0.8));
    rail.position.set(-1.9, 0.75, 6.6);
    scene.add(rail);

    // Belgian brick neighbours with dark tiled gables, set back in the haze.
    function brickHouse(x, z, w, d, h, rot) {
      const g = new THREE.Group();
      const b = box(w, h, d, brickMat);
      b.position.y = h / 2;
      g.add(b);
      const half = d / 2 + 0.25;
      const shape = new THREE.Shape([new THREE.Vector2(-half, 0), new THREE.Vector2(half, 0), new THREE.Vector2(0, 2.4)]);
      const rg = new THREE.ExtrudeGeometry(shape, { depth: w + 0.3, bevelEnabled: false });
      rg.rotateY(Math.PI / 2);
      rg.translate(-(w + 0.3) / 2, h, 0);
      g.add(new THREE.Mesh(rg, tileMat));
      for (const wx of [-w / 4, w / 4]) {
        const win = box(1.0, 1.2, 0.08, std(0x2a3236, 0.1, 0.4));
        win.position.set(wx, 1.6, d / 2 + 0.02);
        g.add(win);
      }
      g.position.set(x, 0, z);
      g.rotation.y = rot;
      scene.add(g);
    }
    brickHouse(-12.5, -3, 6, 6.5, 5.6, 0.1);
    brickHouse(12.8, -4, 6, 7, 5.8, -0.05);
    brickHouse(-4, -15, 7, 6.5, 5.8, 0);
    brickHouse(7, -16, 6.5, 6.5, 5.5, 0.05);

    // Leafy trees: clustered crowns.
    function tree(x, z, s, seed) {
      const r = mulberry(seed);
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1 * s, 0.16 * s, 2.4 * s, 10), std(0x5a4636, 0.9));
      trunk.position.y = 1.2 * s;
      g.add(trunk);
      for (let i = 0; i < 9; i++) {
        const blob = new THREE.Mesh(new THREE.IcosahedronGeometry((0.7 + r() * 0.5) * s, 2), leafMat);
        blob.position.set((r() - 0.5) * 1.6 * s, (2.5 + r() * 1.4) * s, (r() - 0.5) * 1.6 * s);
        blob.scale.y = 0.85;
        g.add(blob);
      }
      g.position.set(x, 0, z);
      scene.add(g);
    }
    tree(-4.8, 4.6, 1.0, 1);
    tree(-4.9, -4.6, 1.15, 2);
    tree(5.2, -5.0, 0.95, 3);
    tree(-9, 9.5, 1.3, 4);
    tree(13.5, 3.5, 1.2, 5);

    // Grass tufts: instanced blades around the house.
    {
      const r = mulberry(99);
      const blade = new THREE.ConeGeometry(0.03, 0.28, 3);
      blade.translate(0, 0.14, 0);
      const N = 3200;
      const im = new THREE.InstancedMesh(blade, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }), N);
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), c = new THREE.Color();
      let n = 0;
      while (n < N) {
        const x = (r() - 0.5) * 13, z = (r() - 0.5) * 13 + 0.5;
        const inHouse = x > HERO.x - HW / 2 - 0.2 && x < HERO.x + HW / 2 + 0.2 && z > HERO.z - UD / 2 - 0.2 && z < HERO.z + HD / 2 + 2.3;
        const inDrive = x > 2.3 && x < 5.1;
        if (inHouse || inDrive) continue;
        e.set((r() - 0.5) * 0.4, r() * Math.PI, (r() - 0.5) * 0.4);
        q.setFromEuler(e);
        const s = 0.6 + r() * 0.8;
        m.compose(new THREE.Vector3(x, 0, z), q, new THREE.Vector3(s, s, s));
        im.setMatrixAt(n, m);
        im.setColorAt(n, c.setHSL(0.24 + r() * 0.05, 0.45, 0.25 + r() * 0.12));
        n++;
      }
      im.receiveShadow = true;
      scene.add(im);
    }

    // ---------- the house ----------
    const hero = new THREE.Group();
    const lower = box(HW, HH, HD, renderMat);
    lower.position.y = HH / 2;
    const plinthStrip = box(HW + 0.02, 0.25, HD + 0.02, std(0x4a4d50, 0.8));
    plinthStrip.position.y = 0.125;
    const upper = box(UW, UH, UD, woodMat);
    upper.position.set(-0.5, HH + UH / 2, 0.2);
    const slab = box(UW + 0.36, 0.2, UD + 0.36, anthracite);
    slab.position.set(upper.position.x, HH + UH + 0.1, upper.position.z);
    const gravel = box(UW + 0.1, 0.04, UD + 0.1, gravelMat);
    gravel.position.set(upper.position.x, HH + UH + 0.22, upper.position.z);
    const coping = box(HW - UW + 0.5, 0.12, HD + 0.05, anthracite);
    coping.position.set(HW / 2 - (HW - UW + 0.5) / 2 + 0.02, HH + 0.06, 0);
    hero.add(lower, plinthStrip, upper, slab, gravel, coping);
    // windows with a room behind
    function windowWithRoom(w, h, depth = 0.5) {
      const g = new THREE.Group();
      const t = 0.07;
      for (const [fw, fh, fx, fy] of [[w + 2 * t, t, 0, h / 2 + t / 2], [w + 2 * t, t, 0, -h / 2 - t / 2], [t, h, -w / 2 - t / 2, 0], [t, h, w / 2 + t / 2, 0], [t * 0.6, h, 0, 0]]) {
        const f = box(fw, fh, 0.08, anthracite);
        f.position.set(fx, fy, 0.04);
        g.add(f);
      }
      // The room is a picture set just behind the glass (the walls are solid boxes).
      const room = new THREE.Mesh(new THREE.PlaneGeometry(w, h), roomMat);
      room.position.z = 0.012;
      g.add(room);
      const gl = box(w, h, 0.01, glass);
      gl.position.z = 0.035;
      g.add(gl);
      return g;
    }
    const bay = windowWithRoom(2.6, 2.1);
    bay.position.set(0.5, 1.2, HD / 2 + 0.01);
    const strip = windowWithRoom(2.4, 0.95);
    strip.position.set(upper.position.x, HH + 1.35, upper.position.z + UD / 2 + 0.01);
    const sideWin = windowWithRoom(1.3, 1.6);
    sideWin.rotation.y = Math.PI / 2;
    sideWin.position.set(HW / 2 + 0.01, 1.35, -0.6);
    const door = box(1.0, 2.15, 0.08, woodMat);
    door.position.set(-1.55, 1.08 + 0.12, HD / 2 + 0.03);
    const canopy = box(1.6, 0.08, 0.9, anthracite);
    canopy.position.set(-1.55, 2.45, HD / 2 + 0.45);
    const downpipe = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, HH + UH, 10), anthracite);
    downpipe.position.set(upper.position.x - UW / 2 + 0.1, (HH + UH) / 2, upper.position.z + UD / 2 + 0.08);
    hero.add(bay, strip, sideWin, door, canopy, downpipe);
    const wallLamps = [];
    for (const x of [-2.15, -0.95]) {
      const lampMat = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0xffd9a0, emissiveIntensity: 0 });
      const lamp = box(0.1, 0.22, 0.08, lampMat);
      lamp.position.set(x, 2.0, HD / 2 + 0.05);
      hero.add(lamp);
      wallLamps.push(lampMat);
    }
    hero.position.copy(HERO);
    scene.add(hero);

    // terrace furniture
    const table = rbox(1.0, 0.06, 0.7, std(0xe5e1d8, 0.6), 0.02);
    table.position.set(0.3, 0.86, HERO.z + HD / 2 + 1.2);
    scene.add(table);
    const tleg = box(0.06, 0.74, 0.06, anthracite);
    for (const [x, z] of [[-0.42, -0.28], [0.42, -0.28], [-0.42, 0.28], [0.42, 0.28]]) {
      const l = tleg.clone();
      l.position.set(table.position.x + x, 0.49, table.position.z + z);
      scene.add(l);
    }
    for (const dx of [-0.85, 0.85]) {
      const chair = rbox(0.5, 0.5, 0.5, std(0x3f4a46, 0.7), 0.06);
      chair.position.set(table.position.x + dx, 0.37, table.position.z);
      scene.add(chair);
    }

    // ---------- equipment ----------
    const roofY = HH + UH + 0.22;
    const panelsRoot = new THREE.Group();
    panelsRoot.position.set(HERO.x + upper.position.x, roofY, HERO.z + upper.position.z);
    scene.add(panelsRoot);
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 3; c++) {
        const g = new THREE.Group();
        const tilt = new THREE.Group();
        const frame = rbox(1.04, 0.045, 1.6, alu, 0.015);
        const cell = box(0.99, 0.02, 1.55, cellMat);
        cell.position.y = 0.025;
        tilt.add(frame, cell);
        tilt.rotation.x = 0.3;
        tilt.position.y = 0.36;
        const legA = box(0.04, 0.5, 0.04, alu);
        legA.position.set(0.4, 0.22, -0.62);
        const legB = legA.clone();
        legB.position.x = -0.4;
        const rail = box(1.0, 0.04, 0.06, alu);
        rail.position.set(0, 0.04, 0);
        g.add(tilt, legA, legB, rail);
        g.position.set((c - 1) * 1.1, 0, (r - 0.5) * 1.8);
        panelsRoot.add(g);
      }
    }

    const battery = new THREE.Group();
    const batBody = rbox(0.66, 1.2, 0.2, std(0xf4f4f2, 0.35, 0.05), 0.05);
    batBody.position.y = 0.6;
    const batBand = box(0.66, 0.08, 0.205, anthracite);
    batBand.position.y = 1.05;
    const gaugeBack = box(0.06, 0.82, 0.01, std(0x9aa09d, 0.6));
    gaugeBack.position.set(0.22, 0.52, 0.105);
    const gauge = box(0.05, 0.8, 0.02, mint);
    gauge.geometry.translate(0, 0.4, 0);
    gauge.position.set(0.22, 0.12, 0.11);
    battery.add(batBody, batBand, gaugeBack, gauge);
    battery.position.set(HERO.x - 0.55, 0.3, HERO.z + HD / 2 + 0.11);
    scene.add(battery);

    const charger = new THREE.Group();
    const post = rbox(0.26, 1.2, 0.2, std(0x012b26, 0.35, 0.3), 0.05);
    post.position.y = 0.6;
    const face = box(0.02, 0.36, 0.12, mint);
    face.position.set(0.135, 0.88, 0);
    charger.add(post, face);
    charger.position.set(2.25, 0, 1.0);
    scene.add(charger);

    const CAR_PARK = new THREE.Vector3(3.7, 0, 1.6);
    const car = new THREE.Group();
    const paint = new THREE.MeshPhysicalMaterial({ color: 0xeef0f0, roughness: 0.25, metalness: 0.15, clearcoat: 1, clearcoatRoughness: 0.05 });
    const body = rbox(1.86, 0.62, 4.3, paint, 0.28);
    body.position.y = 0.58;
    const cabinGlass = new THREE.MeshPhysicalMaterial({ color: 0x0c1014, roughness: 0.04, metalness: 0.5, clearcoat: 1 });
    const cabin = rbox(1.62, 0.55, 2.3, cabinGlass, 0.24);
    cabin.position.set(0, 1.1, -0.25);
    car.add(body, cabin);
    for (const [x, z] of [[0.86, 1.35], [-0.86, 1.35], [0.86, -1.35], [-0.86, -1.35]]) {
      const tyre = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.26, 28), std(0x161718, 0.75));
      tyre.rotation.z = Math.PI / 2;
      tyre.position.set(x, 0.36, z);
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.27, 20), alu);
      rim.rotation.z = Math.PI / 2;
      rim.position.copy(tyre.position);
      car.add(tyre, rim);
    }
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.2 });
    for (const x of [-0.62, 0.62]) {
      const hl = box(0.42, 0.08, 0.04, headMat);
      hl.position.set(x, 0.72, 2.15);
      const tl2 = box(0.45, 0.07, 0.04, new THREE.MeshStandardMaterial({ color: 0x5a0d0d, emissive: 0xff2a2a, emissiveIntensity: 0.4 }));
      tl2.position.set(x, 0.75, -2.15);
      car.add(hl, tl2);
    }
    const chargeLed = new THREE.MeshBasicMaterial({ color: 0x79ffbb, transparent: true, opacity: 0.2 });
    const led = box(0.04, 0.06, 0.3, chargeLed);
    led.position.set(-0.94, 0.8, -1.0);
    car.add(led);
    car.rotation.y = Math.PI;
    scene.add(car);
    const plugCable = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
        new THREE.Vector3(2.39, 0.88, 1.0),
        new THREE.Vector3(2.6, 0.08, 1.3),
        new THREE.Vector3(CAR_PARK.x - 0.95, 0.75, CAR_PARK.z + 1.0),
      ]), 40, 0.035, 8, false),
      std(0x111111, 0.5),
    );
    plugCable.visible = false;
    scene.add(plugCable);

    const ac = new THREE.Group();
    const acBody = rbox(0.4, 0.75, 1.05, std(0xe8eaeb, 0.4, 0.1), 0.04);
    const grille = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.03, 36), anthracite);
    grille.rotation.z = Math.PI / 2;
    grille.position.set(0.21, 0, 0.15);
    const fan = new THREE.Group();
    for (let i = 0; i < 4; i++) {
      const bl = box(0.02, 0.46, 0.1, std(0xbfc5c7, 0.4, 0.4));
      bl.rotation.x = (i * Math.PI) / 2;
      fan.add(bl);
    }
    fan.position.set(0.23, 0, 0.15);
    ac.add(acBody, grille, fan);
    ac.position.set(HERO.x + HW / 2 + 0.21, 0.55, HERO.z - 0.95);
    scene.add(ac);

    // Energy: thin mint pulses on the walls and ground.
    const v = (x, y, z) => new THREE.Vector3(x, y, z);
    const fz = HERO.z + HD / 2 + 0.08;
    const routes = {
      house: new THREE.CatmullRomCurve3([v(HERO.x - 0.5, roofY, HERO.z + upper.position.z + UD / 2 + 0.1), v(HERO.x - 0.5 + UW / 2 + 0.3, HH + 0.15, fz), v(HERO.x + 0.5, 2.35, fz)]),
      battery: new THREE.CatmullRomCurve3([v(HERO.x - 0.9, roofY, HERO.z + upper.position.z + UD / 2 + 0.1), v(HERO.x - 0.7, HH + 0.1, fz), v(HERO.x - 0.55, 1.6, fz + 0.05)]),
      ac: new THREE.CatmullRomCurve3([v(HERO.x + 0.6, roofY, HERO.z), v(HERO.x + HW / 2 + 0.06, HH, HERO.z - 0.5), v(HERO.x + HW / 2 + 0.06, 1.0, HERO.z - 0.95)]),
      car: new THREE.CatmullRomCurve3([v(HERO.x - 0.4, 0.35, fz + 0.08), v(1.0, 0.05, 2.0), v(2.25, 0.05, 1.35), v(CAR_PARK.x - 0.95, 0.7, CAR_PARK.z + 1.0)]),
      night: new THREE.CatmullRomCurve3([v(HERO.x - 0.55, 1.1, fz + 0.12), v(HERO.x - 0.1, 0.2, fz + 0.4), v(HERO.x + 0.5, 1.2, fz + 0.1)]),
    };
    const dashGroups = {};
    for (const k of Object.keys(routes)) {
      dashGroups[k] = [];
      for (let i = 0; i < 16; i++) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), mint);
        m.visible = false;
        scene.add(m);
        dashGroups[k].push(m);
      }
    }
    function flow(name, t, a, b, speed = 0.45) {
      const on = t >= a && t < b;
      const env = Math.min(seg(t, a, a + 0.4), 1 - seg(t, b - 0.4, b));
      dashGroups[name].forEach((m, i) => {
        m.visible = on && env > 0.01;
        if (!m.visible) return;
        const s = (((t - a) * speed + i / 16) % 1 + 1) % 1;
        m.position.copy(routes[name].getPointAt(s));
        m.scale.setScalar(Math.max(0.001, env));
      });
    }

    scene.traverse((o) => {
      if (o.isMesh && o !== skyDome && o !== ground && o.material !== mint && o.material !== chargeLed && o.material !== glass) {
        o.castShadow = true;
        o.receiveShadow = true;
      }
    });
    ground.receiveShadow = true;

    // ---------- camera: eye of a photographer on a crane, slow arc ----------
    const halfV = THREE.MathUtils.degToRad(camera.fov / 2);
    function placeCamera(t) {
      const k = inOut(seg(t, 0, 26.6));
      const az = THREE.MathUtils.degToRad(lerp(22, 52, k));
      const el = THREE.MathUtils.degToRad(lerp(17, 15, k));
      const w = lerp(13.5, 11.2, outCubic(seg(t, 0, 10))) + lerp(0, 1.6, seg(t, 20, 26.6));
      const target = new THREE.Vector3(0.6, 2.3, 0.9);
      const hw = Math.atan(Math.tan(halfV) * (W / H));
      const dist = w / 2 / Math.tan(hw);
      const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
      camera.position.copy(target).addScaledVector(dir, dist);
      camera.lookAt(target);
      camera.setViewOffset(W, H, 0, -H * 0.1, W, H);
      camera.updateProjectionMatrix();
      skyDome.position.copy(camera.position);
    }

    const warmLow = new THREE.Color(0xffa866), noonC = new THREE.Color(0xfff4e6), moonC = new THREE.Color(0x9fb6ff);
    const zen = new THREE.Color(), hor = new THREE.Color();
    host.render = (t) => {
      const h = hourAt(t);
      skyAt(h, zen, hor);
      skyMat.uniforms.zenith.value.copy(zen);
      skyMat.uniforms.horizon.value.copy(hor);
      scene.fog.color.copy(hor);

      const f = (h - 6.5) / (20.3 - 6.5);
      const day = clamp(Math.sin(Math.PI * clamp(f)), 0, 1);
      const night = seg(h, 19.8, 21.2);
      // Sun travels from the back-left to the back-right of the frame, low at both ends.
      const ang = Math.PI * clamp(f, -0.05, 1.05);
      const sunDir = new THREE.Vector3(-Math.cos(ang) * 0.9, 0.06 + Math.sin(ang) * 0.95, -0.55).normalize();
      sun.position.copy(sunDir).multiplyScalar(40);
      sun.color.copy(warmLow).lerp(noonC, Math.pow(day, 0.6));
      sun.intensity = lerp(0.8, 3.4, Math.pow(day, 0.8)) * (1 - night);
      skyMat.uniforms.sunDir.value.copy(sunDir);
      skyMat.uniforms.sunColor.value.copy(sun.color);
      skyMat.uniforms.sunAmount.value = (1 - night) * (0.6 + 0.4 * day);
      if (night > 0) {
        sun.position.lerp(new THREE.Vector3(-10, 30, 14), night);
        sun.color.lerp(moonC, night);
        sun.intensity = lerp(sun.intensity, 0.45, night);
      }
      hemi.color.copy(zen).lerp(new THREE.Color(0xffffff), 0.5);
      hemi.intensity = lerp(0.55, 0.18, night);
      scene.environmentIntensity = lerp(0.6, 0.1, night) * lerp(0.55, 1, day + night);
      renderer.toneMappingExposure = lerp(1.0, 0.95, night);

      cellMat.emissiveIntensity = 0.08 * day * (1 - night);

      flow("house", t, 2.9, 6.6);
      flow("battery", t, 7.0, 9.9);
      flow("ac", t, 10.2, 14.0);
      flow("car", t, 15.6, 17.6);
      flow("night", t, 18.4, 26.6, 0.3);

      gauge.scale.y = Math.max(0.001, lerp(0.25, 1.0, inOut(seg(t, 7.1, 9.6))) - lerp(0, 0.35, seg(t, 18.4, 26.6)) - lerp(0, 0.15, seg(t, 15.6, 17.4)));
      fan.rotation.x = t * 2 + 10 * clamp(t - 10.2, 0, 4.2);

      const ca = seg(t, 14.4, 15.4);
      car.visible = t >= 14.4;
      car.position.set(CAR_PARK.x, 0, lerp(11, CAR_PARK.z, outQuint(ca)));
      headMat.emissiveIntensity = lerp(0.2, 2.0, seg(h, 18, 19.5));
      plugCable.visible = t >= 15.5;
      chargeLed.opacity = t < 15.6 ? 0.2 : 0.4 + 0.6 * Math.abs(Math.sin((t - 15.6) * 2.4));

      const lit = seg(h, 18.8, 20.2);
      roomMat.emissiveIntensity = lerp(0.0, 2.2, lit);
      wallLamps.forEach((m) => (m.emissiveIntensity = lerp(0, 3, lit)));

      placeCamera(t);
      composer.render();
    };
    host.render(host.clock.t);
    host.ready();
  </script>
</template>
