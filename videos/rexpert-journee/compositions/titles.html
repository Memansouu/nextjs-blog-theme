  <div id="root" data-composition-id="titles" data-width="1080" data-height="1920">
    <div id="d-clock" class="clip" data-start="0" data-duration="21.25" data-track-index="0"><span id="d-time">06:54</span></div>
    <div id="d-l1" class="lab clip" data-start="0" data-duration="2.8" data-track-index="1"><span>Le soleil se lève</span></div>
    <div id="d-l2" class="lab clip" data-start="2.45" data-duration="4.35" data-track-index="1"><span>Production solaire</span></div>
    <div id="d-l3" class="lab clip" data-start="6.45" data-duration="3.55" data-track-index="1"><span>Batterie domestique</span></div>

    </div>
  </div>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      // The clock reads the same hour curve the 3D world uses.
      var HOURS = [[0, 6.9], [2.4, 7.4], [3.0, 9.0], [6.4, 10.2], [7.0, 12.8], [9.6, 13.4], [10.2, 15.2], [13.8, 16.0], [14.4, 18.3], [17.2, 19.0], [17.8, 21.8], [21.0, 22.4], [26.6, 23.4]];
      function inOut(k) { return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
      function hourAt(t) {
        var i = 0;
        while (i < HOURS.length - 2 && t > HOURS[i + 1][0]) i++;
        var a = HOURS[i], b = HOURS[i + 1];
        var k = Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0])));
        return a[1] + (b[1] - a[1]) * inOut(k);
      }
      var timeEl = document.getElementById("d-time");
      var clk = { t: 0 };
      tl.fromTo(clk, { t: 0 }, {
        t: 21.2, duration: 21.2, ease: "none",
        onUpdate: function () {
          var h = hourAt(clk.t);
          var hh = Math.floor(h), mm = Math.floor((h - hh) * 60 / 5) * 5;
          timeEl.textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
        },
      }, 0);
      tl.to("#d-time", { yPercent: -110, duration: 0.26, ease: "power2.in" }, 20.95);

      // Labels swap on the clock's jumps: the old one leaves in 0.2 s, then the new one rises in.
      var labs = [["#d-l1", 0, 2.45], ["#d-l2", 2.45, 6.45], ["#d-l3", 6.45, 9.65], ["#d-l4", 9.65, 13.85], ["#d-l5", 13.85, 17.25], ["#d-l6", 17.25, 20.95]];
      labs.forEach(function (c) {
        var s = document.querySelector(c[0] + " span");
        if (c[1] > 0) tl.fromTo(s, { yPercent: 110 }, { yPercent: 0, duration: 0.3, ease: "power3.out" }, c[1] + 0.2);
        tl.fromTo(s, { yPercent: 0 }, { yPercent: -110, duration: 0.2, ease: "power2.in", immediateRender: false }, c[2]);
      });

      var spans = document.querySelectorAll("#d-proof .ln > span");
      tl.fromTo(spans, { yPercent: 110 }, { yPercent: 0, duration: 0.38, ease: "power3.out", stagger: 0.07 }, 21.42);
      tl.to(spans, { yPercent: -110, duration: 0.24, ease: "power2.in", stagger: 0.04 }, 25.6);
      var counter = { v: 0 };
      var num = document.getElementById("d-num");
      tl.fromTo(counter, { v: 0 }, {
        v: 1500, duration: 1.3, ease: "power2.out",
        onUpdate: function () {
          var n = Math.round(counter.v / 10) * 10;
          num.textContent = (n >= 1000 ? Math.floor(n / 1000) + " " + String(n % 1000).padStart(3, "0") : String(n)) + " €";
        },
      }, 21.5);
      tl.fromTo("#d-row1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 23.2);
      tl.fromTo("#d-row2", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 23.9);
      tl.to(["#d-row1", "#d-row2"], { opacity: 0, duration: 0.2 }, 25.6);
      window.__timelines = window.__timelines || {};
      window.__timelines["titles"] = tl;
    })();
  </script>
