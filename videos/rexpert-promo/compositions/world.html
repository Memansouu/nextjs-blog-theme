<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #world-sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #e3e8e6 0%, #f4f4f4 70%);
    }
    #world-sky-free {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #c4f7d4 0%, #effcf2 55%, #f4f4f4 100%);
      opacity: 0;
    }
    #world-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
  </style>
  <div id="root" data-composition-id="world" data-width="1080" data-height="1920" data-layout-allow-overflow>
    <div id="world-sky"></div>
    <div id="world-sky-free"></div>
    <canvas id="world-canvas" class="clip" data-start="0" data-duration="26.6" data-track-index="0" width="1080" height="1920"></canvas>
  </div>
  <script>
    (function () {
      var DURATION = 26.6;
      var clock = { t: 0 };
      var host = { clock: clock, render: null };
      window.__rexWorld = host;
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["world"] = new Promise(function (resolve) {
        host.ready = resolve;
      });
      var tl = gsap.timeline({ paused: true });
      tl.to(clock, {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          if (host.render) host.render(clock.t);
        },
      }, 0);
      // The sky turns mint when the house frees itself.
      tl.fromTo("#world-sky-free", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.inOut" }, 19.4);
      window.__timelines = window.__timelines || {};
      window.__timelines["world"] = tl;
    })();
  </script>
  <script type="module">
    import * as THREE from "./assets/lib/three.module.min.js";

    const host = window.__rexWorld;
    const W = 1080, H = 1920;

    // ---------- time helpers (everything is a pure function of t) ----------
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const seg = (t, a, b) => clamp((t - a) / (b - a));
    const lerp = (a, b, k) => a + (b - a) * k;
    const inOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
    const outCubic = (k) => 1 - Math.pow(1 - k, 3);
    const outBack = (k, s = 1.6) => (k <= 0 ? 0 : k >= 1 ? 1 : 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2));
    const mulberry = (a) => () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const rand = mulberry(20261124);

    // ---------- renderer ----------
    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById("world-canvas"),
      antialias: true,
      alpha: true,
      preserveDrawingBuffer: true,
    });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x7fb88c, 1.25);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xe8ecea, 1.4);
    sun.position.set(-5, 12, 9);
    scene.add(sun);
    const rim = new THREE.DirectionalLight(0xcfe9ff, 0.45);
    rim.position.set(8, 6, -6);
    scene.add(rim);

    const mat = (c, extra = {}) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...extra });
    const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);

    function radialTexture() {
      const c = document.createElement("canvas");
      c.width = c.height = 128;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, "rgba(1,43,38,0.38)");
      grad.addColorStop(1, "rgba(1,43,38,0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, 128, 128);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }
    const shadowTex = radialTexture();
    function contactShadow(w, d) {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(w, d),
        new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }),
      );
      m.rotation.x = -Math.PI / 2;
      m.position.y = 0.035;
      return m;
    }

    // ---------- ground ----------
    const side = mat(0x0b4a3f), grass = mat(0x9fd8a9);
    const ground = new THREE.Mesh(new THREE.BoxGeometry(26, 1.4, 26), [side, side, grass, side, side, side]);
    ground.position.y = -0.7;
    scene.add(ground);
    const road = box(26, 0.06, 2.6, mat(0x3b4744));
    road.position.set(0, 0.03, 0);
    scene.add(road);
    for (let x = -12; x <= 12; x += 2) {
      const dash = box(1, 0.07, 0.14, mat(0xf4f4f4));
      dash.position.set(x, 0.04, 0);
      scene.add(dash);
    }
    const walkMat = mat(0xd9ddd6);
    for (const z of [-1.7, 1.7]) {
      const walk = box(26, 0.08, 0.8, walkMat);
      walk.position.set(0, 0.04, z);
      scene.add(walk);
    }

    // ---------- houses ----------
    function makeHouse({ w = 3.2, d = 3, h = 2.1, rh = 1.25, roof = 0xc46a4a, body = 0xf2efe8 }) {
      const g = new THREE.Group();
      const b = box(w, h, d, mat(body));
      b.position.y = h / 2;
      g.add(b);
      const half = d / 2 + 0.22;
      const shape = new THREE.Shape();
      shape.moveTo(-half, 0);
      shape.lineTo(half, 0);
      shape.lineTo(0, rh);
      shape.lineTo(-half, 0);
      const L = w + 0.36;
      const rg = new THREE.ExtrudeGeometry(shape, { depth: L, bevelEnabled: false });
      rg.rotateY(Math.PI / 2);
      rg.translate(-L / 2, h, 0);
      const r = new THREE.Mesh(rg, mat(roof));
      g.add(r);
      const winMat = new THREE.MeshLambertMaterial({ color: 0x5c6f75, emissive: 0xffd27a, emissiveIntensity: 0 });
      const door = box(0.62, 1.15, 0.06, mat(0x0b4a3f));
      door.position.set(0, 0.58, d / 2 + 0.03);
      g.add(door);
      const wins = [];
      for (const x of [-w / 2 + 0.6, w / 2 - 0.6]) {
        const wn = box(0.62, 0.62, 0.06, winMat);
        wn.position.set(x, 1.3, d / 2 + 0.03);
        g.add(wn);
        wins.push(wn);
      }
      for (const z of [-d / 2 + 0.7, d / 2 - 0.7]) {
        const wn = box(0.06, 0.62, 0.62, winMat);
        wn.position.set(w / 2 + 0.03, 1.3, z);
        g.add(wn);
        wins.push(wn);
      }
      const sh = contactShadow(w + 1.6, d + 1.6);
      g.add(sh);
      g.userData = { w, d, h, rh, half, winMat, ridge: new THREE.Vector3(w / 2 + 0.18, h + rh, 0) };
      return g;
    }

    const HERO = new THREE.Vector3(0.6, 0, 4.6);
    const lots = [
      { p: [-6.4, 0, -4.6], roof: 0xc46a4a },
      { p: [0, 0, -4.8], roof: 0xb85d43 },
      { p: [6.2, 0, -4.6], roof: 0xc46a4a },
      { p: [-6.2, 0, 4.6], roof: 0xb85d43 },
    ];
    const houses = lots.map((l) => {
      const hs = makeHouse({ roof: l.roof });
      hs.position.set(...l.p);
      scene.add(hs);
      return hs;
    });
    const hero = makeHouse({ w: 3.4, d: 3.1, roof: 0x4a545c });
    hero.position.copy(HERO);
    scene.add(hero);
    const hd = hero.userData;

    // trees
    function tree(x, z, s) {
      const g = new THREE.Group();
      const trunk = box(0.16 * s, 0.6 * s, 0.16 * s, mat(0x6b4f3a));
      trunk.position.y = 0.3 * s;
      const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(0.62 * s, 0), mat(0x5fb56f));
      crown.position.y = 1.05 * s;
      g.add(trunk, crown, contactShadow(1.3 * s, 1.3 * s));
      g.position.set(x, 0, z);
      g.rotation.y = rand() * Math.PI;
      scene.add(g);
    }
    [[-10, -8], [-3.2, -8.6], [3.4, -8.2], [-10.4, 8.6], [-2.8, 9.2], [4.6, 9.6], [10.4, 8.4], [10.8, 3.2], [-10.8, 2.8]].forEach(([x, z]) =>
      tree(x, z, 0.85 + rand() * 0.4),
    );

    // ---------- pylon ----------
    const PYLON = new THREE.Vector3(-9.2, 0, -9.6);
    const steel = mat(0x5d6b68);
    const pylon = new THREE.Group();
    const legs = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
    for (const [sx, sz] of legs) {
      const a = new THREE.Vector3(sx * 0.9, 0, sz * 0.9), b = new THREE.Vector3(sx * 0.22, 7.2, sz * 0.22);
      const len = a.distanceTo(b);
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, len, 6), steel);
      leg.position.copy(a.clone().add(b).multiplyScalar(0.5));
      leg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
      pylon.add(leg);
    }
    for (const y of [2.2, 4.2]) {
      const k = y / 7.2, s = lerp(0.9, 0.22, k) * 2;
      const ring = box(s, 0.08, s, steel);
      ring.position.y = y;
      pylon.add(ring);
    }
    for (const [y, w] of [[6.1, 3.4], [7.1, 2.4]]) {
      const arm = box(w, 0.14, 0.14, steel);
      arm.position.y = y;
      arm.rotation.y = Math.PI / 4;
      pylon.add(arm);
    }
    pylon.add(contactShadow(3, 3));
    pylon.position.copy(PYLON);
    scene.add(pylon);
    const armTip = (i) => {
      const off = [-1.5, -0.5, 0.5, 1.5][i % 4];
      return new THREE.Vector3(PYLON.x + off * 0.707 * 1.1, 6.05, PYLON.z - off * 0.707 * 1.1);
    };

    // ---------- cables ----------
    const cableMat = new THREE.MeshLambertMaterial({ color: 0x263330, transparent: true, opacity: 1 });
    function cablePoints(a, b, sag, upto = 1) {
      const pts = [];
      for (let i = 0; i <= 40; i++) {
        const s = (i / 40) * upto;
        const p = a.clone().lerp(b, s);
        p.y -= sag * 4 * s * (1 - s);
        pts.push(p);
      }
      return pts;
    }
    function tubeFrom(pts) {
      return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, 0.035, 5, false);
    }
    const allHouses = [...houses, hero];
    const cables = allHouses.map((hs, i) => {
      const end = hs.position.clone().add(hs.userData.ridge);
      const start = armTip(i);
      const sag = 1.2 + 0.2 * i;
      const mesh = new THREE.Mesh(tubeFrom(cablePoints(start, end, sag)), cableMat);
      scene.add(mesh);
      return { start, end, sag, mesh };
    });
    const heroCable = cables[cables.length - 1];
    heroCable.mesh.material = cableMat.clone();

    // grid pulses: grey beads sent from the pylon to every house
    const beadMat = new THREE.MeshBasicMaterial({ color: 0x4f5f5b });
    const beads = [];
    cables.forEach((c, i) => {
      for (let k = 0; k < 3; k++) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), beadMat);
        m.visible = false;
        scene.add(m);
        beads.push({ c, m, phase: k / 3 + i * 0.11 });
      }
    });

    // ---------- hero equipment ----------
    // Solar panels on the front slope (2 rows x 3 columns).
    const slope = Math.atan2(hd.rh, hd.half);
    const panelsRoot = new THREE.Group();
    panelsRoot.position.set(HERO.x, hd.h + hd.rh / 2, HERO.z + hd.half / 2);
    panelsRoot.rotation.x = slope;
    scene.add(panelsRoot);
    const cellMat = new THREE.MeshLambertMaterial({ color: 0x1b3a6b, emissive: 0x2c6bd8, emissiveIntensity: 0 });
    const frameMat = mat(0xf4f4f4);
    const panels = [];
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 3; c++) {
        const g = new THREE.Group();
        const f = box(0.98, 0.06, 0.66, frameMat);
        const cell = box(0.9, 0.04, 0.58, cellMat);
        cell.position.y = 0.035;
        g.add(f, cell);
        const bx = (c - 1) * 1.04, bz = (r - 0.5) * 0.74;
        g.userData.base = new THREE.Vector3(bx, 0.07, bz);
        g.visible = false;
        panelsRoot.add(g);
        panels.push(g);
      }
    }

    // Wall battery, front wall left of the door.
    const battery = new THREE.Group();
    const batBody = box(0.56, 1.1, 0.24, mat(0xfafafa));
    batBody.position.y = 0.55;
    const gaugeBack = box(0.1, 0.86, 0.02, mat(0x0b4a3f));
    gaugeBack.position.set(0, 0.55, 0.13);
    const mint = new THREE.MeshBasicMaterial({ color: 0x79ffbb });
    const gauge = box(0.08, 0.84, 0.03, mint);
    gauge.geometry.translate(0, 0.42, 0);
    gauge.position.set(0, 0.13, 0.135);
    battery.add(batBody, gaugeBack, gauge);
    battery.position.set(HERO.x - 1.05, 0, HERO.z + hd.d / 2 + 0.14);
    scene.add(battery);

    // Charger post, between the house and the driveway.
    const charger = new THREE.Group();
    const post = box(0.26, 1.05, 0.2, mat(0x012b26));
    post.position.y = 0.52;
    const face = box(0.03, 0.3, 0.14, mint);
    face.position.set(0.14, 0.78, 0);
    charger.add(post, face, contactShadow(0.8, 0.8));
    charger.position.set(HERO.x + 2.35, 0, HERO.z + 0.9);
    scene.add(charger);

    // Car.
    const car = new THREE.Group();
    const carBody = box(0.92, 0.42, 1.75, mat(0xf7f7f5));
    carBody.position.y = 0.38;
    const cabin = box(0.82, 0.38, 0.95, mat(0xf7f7f5));
    cabin.position.set(0, 0.78, -0.12);
    const glass = mat(0x24323a);
    const wsF = box(0.78, 0.3, 0.04, glass);
    wsF.position.set(0, 0.79, 0.37);
    const wsS1 = box(0.04, 0.28, 0.78, glass);
    wsS1.position.set(0.42, 0.79, -0.12);
    const wsS2 = wsS1.clone();
    wsS2.position.x = -0.42;
    car.add(carBody, cabin, wsF, wsS1, wsS2);
    const tyre = mat(0x1d2524);
    for (const [x, z] of [[0.44, 0.55], [-0.44, 0.55], [0.44, -0.55], [-0.44, -0.55]]) {
      const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.14, 14), tyre);
      wh.rotation.z = Math.PI / 2;
      wh.position.set(x, 0.2, z);
      car.add(wh);
    }
    car.add(contactShadow(1.6, 2.4));
    scene.add(car);
    const CAR_PARK = new THREE.Vector3(HERO.x + 3.45, 0, HERO.z + 0.5);
    const driveway = box(1.8, 0.05, 3.2, mat(0xc9cec7));
    driveway.position.set(CAR_PARK.x, 0.03, HERO.z - 0.2 + 0.4);
    scene.add(driveway);

    // Charging cable from the post to the car.
    const plugCable = new THREE.Mesh(
      new THREE.TubeGeometry(
        new THREE.CatmullRomCurve3([
          new THREE.Vector3(charger.position.x + 0.15, 0.78, charger.position.z),
          new THREE.Vector3(charger.position.x + 0.45, 0.25, charger.position.z + 0.1),
          new THREE.Vector3(CAR_PARK.x - 0.47, 0.5, CAR_PARK.z + 0.3),
        ]),
        24, 0.04, 5, false,
      ),
      mat(0x012b26),
    );
    plugCable.visible = false;
    scene.add(plugCable);

    // Air conditioning unit on the right wall.
    const ac = new THREE.Group();
    const acBody = box(0.34, 0.62, 0.86, mat(0xe9eef0));
    const grille = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.03, 20), mat(0x3b4744));
    grille.rotation.z = Math.PI / 2;
    grille.position.set(0.18, 0, 0.12);
    const fan = new THREE.Group();
    for (let i = 0; i < 3; i++) {
      const bl = box(0.02, 0.36, 0.08, mat(0xcfd6d8));
      bl.rotation.x = (i * Math.PI * 2) / 3;
      fan.add(bl);
    }
    fan.position.set(0.2, 0, 0.12);
    ac.add(acBody, grille, fan);
    ac.position.set(HERO.x + hd.w / 2 + 0.17, 1.55, HERO.z - 0.75);
    scene.add(ac);

    // Mint energy dashes: roof → battery, battery → charger → car.
    const flowPath = new THREE.CatmullRomCurve3([
      new THREE.Vector3(HERO.x - 1.05, hd.h + 0.05, HERO.z + hd.half),
      new THREE.Vector3(HERO.x - 1.05, 1.15, HERO.z + hd.d / 2 + 0.3),
      new THREE.Vector3(HERO.x - 1.05, 0.08, HERO.z + hd.d / 2 + 0.55),
      new THREE.Vector3(HERO.x + 1.2, 0.08, HERO.z + hd.d / 2 + 0.55),
      new THREE.Vector3(charger.position.x, 0.08, HERO.z + 1.4),
      new THREE.Vector3(CAR_PARK.x - 0.5, 0.08, CAR_PARK.z + 0.3),
    ], false, "catmullrom", 0.1);
    const dashes = [];
    for (let i = 0; i < 16; i++) {
      const m = box(0.16, 0.06, 0.16, mint);
      m.visible = false;
      scene.add(m);
      dashes.push(m);
    }

    // ---------- camera rig ----------
    const EL = THREE.MathUtils.degToRad(35.264);
    const keys = [
      { t: 0.0, x: -1.0, y: 1.0, z: -0.6, w: 25, az: 45 },
      { t: 6.6, x: -0.4, y: 0.8, z: 0.6, w: 22.5, az: 45 },
      { t: 8.8, x: HERO.x + 0.6, y: 1.6, z: HERO.z, w: 10.8, az: 40 },
      { t: 11.4, x: HERO.x + 0.3, y: 2.4, z: HERO.z + 0.4, w: 9.6, az: 36 },
      { t: 14.0, x: HERO.x - 0.4, y: 1.3, z: HERO.z + 1.2, w: 9.8, az: 46 },
      { t: 16.9, x: HERO.x + 2.4, y: 0.9, z: HERO.z + 0.8, w: 10.6, az: 52 },
      { t: 19.0, x: HERO.x + 1.6, y: 1.6, z: HERO.z, w: 10.2, az: 57 },
      { t: 21.2, x: 0.6, y: 0.4, z: 2.2, w: 18.5, az: 45 },
      { t: 26.6, x: 0.4, y: 0.4, z: 1.8, w: 19.5, az: 41 },
    ];
    function camAt(t) {
      let i = 0;
      while (i < keys.length - 2 && t > keys[i + 1].t) i++;
      const a = keys[i], b = keys[i + 1];
      const k = inOut(seg(t, a.t, b.t));
      return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), z: lerp(a.z, b.z, k), w: lerp(a.w, b.w, k), az: lerp(a.az, b.az, k) };
    }
    const target = new THREE.Vector3();
    function placeCamera(t) {
      const c = camAt(t);
      const az = THREE.MathUtils.degToRad(c.az);
      target.set(c.x, c.y, c.z);
      const dir = new THREE.Vector3(Math.sin(az) * Math.cos(EL), Math.sin(EL), Math.cos(az) * Math.cos(EL));
      camera.position.copy(target).addScaledVector(dir, 60);
      camera.lookAt(target);
      const hw = c.w / 2, hh = (c.w * H) / W / 2;
      const shift = hh * 0.2; // put the subject below the title band
      camera.left = -hw;
      camera.right = hw;
      camera.top = hh + shift;
      camera.bottom = -hh + shift;
      camera.updateProjectionMatrix();
    }

    // ---------- the frame at t ----------
    const warm = new THREE.Color(0xfff1dc), grey = new THREE.Color(0xe8ecea);
    let lastCableKey = -1;
    host.render = (t) => {
      placeCamera(t);

      // Light warms up once the house starts equipping itself.
      const warmK = seg(t, 8.6, 10.2);
      sun.color.copy(grey).lerp(warm, warmK);
      sun.intensity = lerp(1.4, 2.0, warmK);

      // Grid beads travel pylon → houses during the "dependence" beat.
      const beadOn = t > 3.3 && t < 7.2;
      for (const b of beads) {
        b.m.visible = beadOn;
        if (!beadOn) continue;
        const s = ((t - 3.3) * 0.55 + b.phase) % 1;
        const p = cablePoints(b.c.start, b.c.end, b.c.sag)[Math.round(s * 40)];
        b.m.position.copy(p);
      }

      // Panels drop onto the roof one by one.
      panels.forEach((g, i) => {
        const t0 = 9.35 + i * 0.12;
        const k = seg(t, t0, t0 + 0.45);
        g.visible = t >= t0;
        g.position.copy(g.userData.base);
        g.position.y += (1 - outBack(k, 1.2)) * 3.2;
      });
      cellMat.emissiveIntensity = 0.35 * seg(t, 19.5, 20.3);

      // Battery rises from the ground, then its gauge fills.
      const bk = outBack(seg(t, 11.75, 12.25), 1.4);
      battery.visible = t >= 11.75;
      battery.scale.set(1, Math.max(0.001, bk), 1);
      gauge.scale.y = Math.max(0.001, inOut(seg(t, 12.3, 13.5)));

      // The car drives in along the road, then turns into the driveway.
      const ca = seg(t, 14.15, 15.05), cb = seg(t, 15.05, 15.75);
      car.visible = t >= 14.15;
      if (cb <= 0) {
        car.position.set(lerp(13.5, CAR_PARK.x, outCubic(ca)), 0, 0.55);
        car.rotation.y = -Math.PI / 2;
      } else {
        const k = inOut(cb);
        car.position.set(CAR_PARK.x, 0, lerp(0.55, CAR_PARK.z, k));
        car.rotation.y = lerp(-Math.PI / 2, 0, k);
      }
      const chk = outBack(seg(t, 14.0, 14.45), 1.8);
      charger.visible = t >= 14.0;
      charger.scale.setScalar(Math.max(0.001, chk));
      plugCable.visible = t >= 15.95;

      // Air conditioning pops onto the wall; the fan turns.
      const ak = outBack(seg(t, 17.25, 17.7), 1.8);
      ac.visible = t >= 17.25;
      ac.scale.setScalar(Math.max(0.001, ak));
      fan.rotation.x = t * 9;

      // Liberation: the hero's grid cable slackens and pulls back to the pylon.
      const rk = seg(t, 19.25, 20.1);
      const key = Math.round(rk * 60);
      if (key !== lastCableKey) {
        lastCableKey = key;
        const upto = lerp(1, 0.38, inOut(rk));
        const sag = lerp(heroCable.sag, heroCable.sag + 2.2, outCubic(rk));
        heroCable.mesh.geometry.dispose();
        heroCable.mesh.geometry = tubeFrom(cablePoints(heroCable.start, heroCable.end, sag, upto));
      }
      heroCable.mesh.material.opacity = 1 - seg(t, 20.0, 20.6);
      heroCable.mesh.visible = t < 20.6;

      // Windows light up from inside.
      hd.winMat.emissiveIntensity = 0.95 * outCubic(seg(t, 19.7, 20.3));

      // Mint energy flows once the house is free.
      const flowOn = t >= 19.9;
      dashes.forEach((m, i) => {
        m.visible = flowOn;
        if (!flowOn) return;
        const s = (((t - 19.9) * 0.32 + i / dashes.length) % 1 + 1) % 1;
        m.position.copy(flowPath.getPointAt(s));
        const fade = seg(t, 19.9, 20.4);
        m.scale.setScalar(Math.max(0.001, fade));
      });

      renderer.render(scene, camera);
    };
    host.render(host.clock.t);
    host.ready();
  </script>
</template>
